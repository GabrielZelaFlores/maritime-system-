{{ $alerta := .alerta }}
{{ $emb := index (where hugo.Data.embarcaciones "id" $alerta.embarcacion_id) 0 }}
<article class="record-card">
  <div class="card-head">
    <h3>{{ $alerta.tipo }}</h3>
    <span class="badge priority-{{ lower $alerta.prioridad }}">{{ $alerta.prioridad }}</span>
  </div>
  <p>{{ $alerta.descripcion }}</p>
  <dl class="details compact">
    <div><dt>Embarcacion</dt><dd>{{ with $emb }}{{ .nombre }}{{ end }}</dd></div>
    <div><dt>Fecha</dt><dd>{{ $alerta.fecha }}</dd></div>
    <div><dt>Estado</dt><dd>{{ $alerta.estado }}</dd></div>
  </dl>
</article>
